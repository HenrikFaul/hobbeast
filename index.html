    <!--
      What a fetcher without JavaScript sees.

      Google's OAuth branding review does not run scripts, so it received an
      empty React shell — 86 characters of visible text — and reported the home
      page as "unresponsive". The site was answering in 100ms; there was simply
      nothing in the document to read.

      React replaces #root on mount, so this block never reaches a person with
      scripting on. It is also the honest fallback for anyone without it.
    -->
