name: Deploy Edge Functions

# The source-manager function bundles a verbatim copy of the collector's recipe
# engine, so the admin preview and the production worker read a page the same
# way. That promise only holds if the deployed copy tracks the repository —
# deploying it by hand is how the two drift apart.
#
# Needs one repository secret: SUPABASE_ACCESS_TOKEN, a personal access token
# from the Supabase dashboard. The project ref is not a secret — it is read from
# supabase/config.toml, the same file the CLI uses locally.
#
# Without the token the job says so and stops, rather than failing in a way that
# looks like a broken build.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:
    inputs:
      function:
        description: 'Function to deploy'
        required: false
        default: 'source-manager'

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check the recipe copy is in sync before shipping it
        run: node scripts/sync-edge-recipes.mjs --check

      - name: Read the project ref
        id: project
        run: |
          REF=$(grep -m1 '^project_id' supabase/config.toml | cut -d'"' -f2)
          if [ -z "$REF" ]; then
            echo "::error::project_id is missing from supabase/config.toml"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Check credentials
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set — skipping the deploy. Add it under Settings > Secrets and variables > Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes supabase@latest functions deploy \
            "${{ github.event.inputs.function || 'source-manager' }}" \
            --project-ref "${{ steps.project.outputs.ref }}"
