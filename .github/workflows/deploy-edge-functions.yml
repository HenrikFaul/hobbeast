name: Deploy Edge Functions

# The source-manager function bundles a verbatim copy of the collector's recipe
# engine, so the admin preview and the production worker read a page the same
# way. That promise only holds if the deployed copy tracks the repository —
# deploying it by hand is how the two drift apart.
#
# Requires two repository secrets:
#   SUPABASE_ACCESS_TOKEN  — a personal access token from the Supabase dashboard
#   SUPABASE_PROJECT_ID    — the project ref (bqdvqmpwccsxumzijspj)
# Without them the job explains what is missing and stops, rather than failing
# in a way that looks like a broken build.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:
    inputs:
      function:
        description: 'Function to deploy'
        required: false
        default: 'source-manager'

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check the recipe copy is in sync before shipping it
        run: node scripts/sync-edge-recipes.mjs --check

      - name: Check credentials
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PROJECT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID are not set — skipping the deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes supabase@latest functions deploy \
            "${{ github.event.inputs.function || 'source-manager' }}" \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
