name: Mobile Build (Capacitor)

# Reprodukálható natív build pipeline a Hobbeast / Expericentre mobilappokhoz.
#
# - Android: Ubuntu runneren fordul, debug APK (telepíthető teszthez) + release AAB
#   (aláíratlan; a Play Console-hoz keystore-ral kell aláírni — külön gate).
# - iOS: macOS runneren fordul (Windowson nincs helyi iOS build). Aláíratlan
#   archívum készül; a .ipa exporthoz és a store-feltöltéshez Apple Developer
#   tanúsítvány/provisioning kell — külön gate.
#
# Kézzel indítható (workflow_dispatch) vagy `mobile-v*` tag push-ra, hogy a
# (különösen a macOS) runner-költség szándékolt legyen.

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'iOS build futtatása macOS runneren (költséges)'
        type: boolean
        default: true
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: read

env:
  # A publishable kulcs publikus, de a meglévő CI-vel egyezően secretből jön.
  VITE_SUPABASE_URL: https://bqdvqmpwccsxumzijspj.supabase.co
  VITE_SUPABASE_PROJECT_ID: bqdvqmpwccsxumzijspj
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  android:
    name: Android • APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build
        env:
          VITE_BUILD_COMMIT_SHA: ${{ github.sha }}

      - name: Capacitor sync (Android)
        run: bunx cap sync android

      - name: Configure release signing (if secrets present)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p android/keystores
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystores/hobbeast-upload.jks
            printf 'storeFile=keystores/hobbeast-upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/keystore.properties
            echo "::notice::Release signing configured from secrets."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — release will be debug-signed (not store-uploadable)."
          fi

      - name: Assemble release APK + AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        working-directory: android

      - name: Gate — reject a debuggable release
        run: |
          BADGING="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2 dump badging"
          if $BADGING android/app/build/outputs/apk/release/app-release.apk | grep -q "application-debuggable"; then
            echo "::error::Release APK is debuggable — refusing to ship."; exit 1
          fi
          echo "Release APK is not debuggable."

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hobbeast-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iOS • unsigned archive
    runs-on: macos-latest
    timeout-minutes: 40
    if: ${{ github.event_name == 'push' || inputs.build_ios }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web bundle
        run: bun run build
        env:
          VITE_BUILD_COMMIT_SHA: ${{ github.sha }}

      - name: Capacitor sync (iOS)
        run: bunx cap sync ios

      - name: CocoaPods install
        run: pod install
        working-directory: ios/App

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
        working-directory: ios/App

      - name: Zip archive
        run: ditto -c -k --keepParent "$RUNNER_TEMP/App.xcarchive" "$RUNNER_TEMP/App.xcarchive.zip"

      - name: Upload iOS artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: hobbeast-ios-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/App.xcarchive.zip
          if-no-files-found: error
