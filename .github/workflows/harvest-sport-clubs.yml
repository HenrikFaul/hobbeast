name: Harvest clubs

# Sport clubs come from the national club finder; community clubs - a
# baba-mama circle, a pensioners' choir, a board-game night - come from the
# "Klubjaink" pages of the cultural centres that host them. Both worklists are
# read from the club_directories table, so adding a source is an admin action
# rather than a change to this file.
#
# Every run stamps last_seen_at on what it still finds and marks what stopped
# appearing as stale; nothing is deleted and a curated club is never
# overwritten. The service-role key never leaves the runner.
#
# The schedule below is the safety net. The operator's own schedules live in
# club_refresh_schedules and are dispatched hourly by run_due_club_refresh_schedules().

on:
  workflow_dispatch:
    inputs:
      directories:
        description: 'Directory keys, comma separated (empty = every enabled one)'
        required: false
        default: ''
  schedule:
    # 04:20 UTC on the 3rd of each month — off the hour, off the peak.
    - cron: '20 4 3 * *'

concurrency:
  group: harvest-clubs
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check credentials
        id: creds
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not set."
            exit 1
          fi

      - name: Harvest and ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.directories }}" ]; then
            node scripts/harvest-sport-clubs.mjs --ingest --directories "${{ github.event.inputs.directories }}"
          else
            node scripts/harvest-sport-clubs.mjs --ingest
          fi
