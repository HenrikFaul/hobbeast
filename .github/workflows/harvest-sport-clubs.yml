name: Harvest sport clubs

# Hungarian sport is organised in clubs, and the clubs are already listed
# publicly, by sport, in the national club finder. This reads those listings
# and hands them to ingest_directory_clubs, which inserts what is new and only
# ever fills gaps on what already exists — a curated club is never overwritten.
#
# Runs on demand, and monthly so the directory does not rot. The service-role
# key never leaves the runner.

on:
  workflow_dispatch:
    inputs:
      sport:
        description: 'Single sport slug (empty = all)'
        required: false
        default: ''
  schedule:
    # 04:20 UTC on the 3rd of each month — off the hour, off the peak.
    - cron: '20 4 3 * *'

concurrency:
  group: harvest-sport-clubs
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check credentials
        id: creds
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not set."
            exit 1
          fi

      - name: Harvest and ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.sport }}" ]; then
            node scripts/harvest-sport-clubs.mjs --ingest --sport "${{ github.event.inputs.sport }}"
          else
            node scripts/harvest-sport-clubs.mjs --ingest
          fi
