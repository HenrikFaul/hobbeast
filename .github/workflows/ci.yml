name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck • Tests • Release validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests (Vitest)
        run: bun run test

      - name: Release validate
        run: node scripts/validate-release.mjs

      - name: Build
        run: bun run build
