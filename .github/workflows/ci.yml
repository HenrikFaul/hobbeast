name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Supply chain • Quality • Release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prove lockfile integrity
        run: git diff --exit-code -- package.json bun.lock

      - name: Dependency vulnerability audit
        run: bun audit --audit-level=high

      - name: Tracked secret scan
        run: bun run security:secrets

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (Vitest)
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Security-definer policy audit
        run: bun run security:audit

      - name: Capture reproducible build metadata
        run: echo "VITE_BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://bqdvqmpwccsxumzijspj.supabase.co
          VITE_SUPABASE_PROJECT_ID: bqdvqmpwccsxumzijspj
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BUILD_COMMIT_SHA: ${{ github.sha }}

      - name: Enforce route and asset performance budgets
        run: bun run quality:performance

      - name: Release validate
        run: bun run release:validate

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: bun run test:e2e
        env:
          VITE_SUPABASE_URL: https://bqdvqmpwccsxumzijspj.supabase.co
          VITE_SUPABASE_PROJECT_ID: bqdvqmpwccsxumzijspj
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Generate release SBOM
        if: always()
        run: bun run release:sbom
        env:
          BUILD_COMMIT_SHA: ${{ github.sha }}
          BUILD_TIMESTAMP: ${{ github.event.repository.updated_at }}

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hobbeast-${{ github.sha }}-quality-evidence
          path: |
            artifacts/hobbeast-sbom.cdx.json
            docs/quality/quality-baseline.json
            playwright-report/
          if-no-files-found: warn
