name: Event scraper

# Renders JS-heavy Hungarian event sites with Playwright and upserts dated events
# into Hobbeast via the controlled service-role ingest RPC. Free on GitHub Actions.
# Runs 3x/day (well within free-tier minutes) plus manual dispatch.

on:
  schedule:
    - cron: '17 4,12,20 * * *' # 06:17 / 14:17 / 22:17 Europe/Budapest (UTC+2)
  workflow_dispatch:
    inputs:
      sources:
        description: 'Registry sources per run'
        required: false
        default: '40'
      details:
        description: 'Detail pages per source'
        required: false
        default: '40'
      only:
        description: 'Comma-separated source_ids (manual targeted run from the admin panel)'
        required: false
        default: ''
      crawl:
        description: 'Run the deep source-discovery crawl after collection (true/false)'
        required: false
        default: 'false'
      crawl_only:
        description: 'Run ONLY the crawl, skipping collection — the fast manual path (true/false)'
        required: false
        default: 'false'
      crawl_pages:
        description: 'Override the crawl page budget for this run (0 = use config)'
        required: false
        default: '0'

concurrency:
  # A crawl-only run gets its own lane, so a manual crawl is not stuck queued
  # behind a long scheduled scrape (they touch different tables anyway).
  group: event-scraper-${{ github.event.inputs.crawl_only == 'true' && 'crawl' || 'scrape' }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: scraper-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node index.mjs
          --sources ${{ github.event.inputs.sources || '40' }}
          --details ${{ github.event.inputs.details || '40' }}
          --only "${{ github.event.inputs.only || '' }}"
          ${{ github.event.inputs.crawl_only == 'true' && '--crawl-only' || (github.event.inputs.crawl == 'true' && '--crawl' || '') }}
          --crawl-pages ${{ github.event.inputs.crawl_pages || '0' }}
